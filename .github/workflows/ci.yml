name: Frontend CI

on:
  push:
    branches: [develop, main, 'feature/**', 'fix/**', 'hotfix/**', 'release/**']
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the badge step push coverage.json to the badges branch
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      # Coverage badge: after a push to develop, write the line coverage as a
      # shields.io endpoint file on the "badges" branch. The README badge reads it.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          pct=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{if(f>0) printf "%.0f", h*100/f; else print 0}' coverage/lcov.info)
          if [ "$pct" -ge 80 ]; then color=brightgreen; elif [ "$pct" -ge 60 ]; then color=yellow; else color=red; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${pct}%\",\"color\":\"${color}\"}" > "$RUNNER_TEMP/coverage.json"
          echo "Line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch origin badges
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . > /dev/null
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet || git commit -m "chore(badges): update coverage badge to ${pct}%"
          git push origin badges

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Fails on any high/critical advisory except the accepted risks listed in
      # audit-ci.jsonc (documented in ADR-14).
      - run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc
